# RSS Reader — Apache vhost template
#
# Port-based deployment (HTTPS on a non-standard port). For a subpath
# deployment under an existing vhost, see DEPLOYMENT.md.
#
# Replace the placeholders before installing into apache:
#   YOUR_DOMAIN     fully-qualified hostname (e.g. example.com)
#   YOUR_PORT       HTTPS port to listen on (e.g. 3444)
#   YOUR_CERT_PATH  TLS cert + key paths (e.g. /etc/letsencrypt/live/example.com)
#   BACKEND_PORT    local port the backend Node server listens on (e.g. 3003)

Listen YOUR_PORT

<VirtualHost *:YOUR_PORT>
    ServerName YOUR_DOMAIN

    SSLEngine on
    SSLCertificateFile YOUR_CERT_PATH/fullchain.pem
    SSLCertificateKeyFile YOUR_CERT_PATH/privkey.pem

    DocumentRoot /var/www/html/rss-reader

    <Directory /var/www/html/rss-reader>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # React Router — serve index.html for all routes
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/auth
        RewriteCond %{REQUEST_URI} !^/api
        RewriteRule . /index.html [L]
    </Directory>

    # Forward headers for proper handling behind proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "YOUR_PORT"

    # Proxy API and Auth requests to backend
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:BACKEND_PORT/api
    ProxyPassReverse /api http://127.0.0.1:BACKEND_PORT/api
    ProxyPass /auth http://127.0.0.1:BACKEND_PORT/auth
    ProxyPassReverse /auth http://127.0.0.1:BACKEND_PORT/auth

    ErrorLog ${APACHE_LOG_DIR}/rss-reader-error.log
    CustomLog ${APACHE_LOG_DIR}/rss-reader-access.log combined
</VirtualHost>
