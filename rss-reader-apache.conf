# RSS Reader - Port-based Configuration
# Access via: https://secorp.net:3444/

# Listen on port 3444 for HTTPS
Listen 3444

<VirtualHost *:3444>
    ServerName secorp.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/secorp.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/secorp.net/privkey.pem

    DocumentRoot /var/www/html/rss-reader

    <Directory /var/www/html/rss-reader>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # React Router - serve index.html for all routes
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/auth
        RewriteCond %{REQUEST_URI} !^/api
        RewriteRule . /index.html [L]
    </Directory>

    # Forward headers for proper handling behind proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "3444"

    # Proxy API and Auth requests to backend
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3003/api
    ProxyPassReverse /api http://127.0.0.1:3003/api
    ProxyPass /auth http://127.0.0.1:3003/auth
    ProxyPassReverse /auth http://127.0.0.1:3003/auth

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/rss-reader-error.log
    CustomLog ${APACHE_LOG_DIR}/rss-reader-access.log combined
</VirtualHost>
